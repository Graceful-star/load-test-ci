name: CI Load Test with k6

on:
  pull_request:
    branches:
      - main

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Install Node.js (for k6)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install k6
        run: |
          curl https://github.com/grafana/k6/releases/download/v0.53.0/k6-v0.53.0-linux-amd64.tar.gz -L -s | tar xvz --strip-components=1
          chmod +x k6
          sudo mv k6 /usr/local/bin/k6

      - name: Create KinD cluster
        run: kind create cluster --config kind-config.yaml --name ci-load-test

      - name: Deploy Ingress-NGINX
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s

      - name: Deploy foo and bar services
        run: |
          kubectl apply -f deploy-foo.yaml
          kubectl apply -f deploy-bar.yaml
          kubectl apply -f ingress.yaml
          kubectl rollout status deployment/foo --timeout=120s
          kubectl rollout status deployment/bar --timeout=120s

      - name: Run k6 load test
        run: k6 run load-test.js --summary-export=results.json

      - name: Generate markdown report from k6 results
        run: |
          # Simple extraction - you can make this more sophisticated
          cat <<EOF > load-test-results.md
          ## k6 Load Test Results (30s, 20 VUs)

          **Test script**: Randomized traffic between foo.localhost & bar.localhost

          \`\`\`json
          $(cat results.json | jq .metrics)
          \`\`\`

          ### Key Metrics:
          - **http_req_duration** (response time):
            - avg: $(jq -r '.metrics.http_req_duration.values.avg' results.json) ms
            - p(90): $(jq -r '.metrics.http_req_duration.values."p(90)"' results.json) ms
            - p(95): $(jq -r '.metrics.http_req_duration.values."p(95)"' results.json) ms
          - **http_req_failed** (error rate): $(jq -r '.metrics.http_req_failed.values.rate * 100' results.json)% 
          - **requests per second** (approx): $(jq -r '.metrics.http_reqs.values.rate' results.json | awk '{printf "%.1f", $1}')
          - **Total requests**: $(jq -r '.metrics.http_reqs.values.count' results.json)

          Full raw JSON results are available in workflow artifacts.
          EOF

      - name: Upload k6 results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: results.json

      - name: Post results to PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(jq -Rs . < load-test-results.md)
          curl -H "Authorization: token $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github.v3+json" \
               -d "{\"body\": $body}" \
               https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.number }}/comments